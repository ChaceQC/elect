name: 容器验证
on:
  push:
    branches: ['**', '!main']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      validation:
        description: 验证范围（默认完整）
        type: choice
        default: full
        options: [full, quick]
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  backend:
    uses: ./.github/workflows/build-check.yaml
    with:
      part: backend
      export-images: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.validation != 'quick') }}
  frontend:
    uses: ./.github/workflows/build-check.yaml
    with:
      part: frontend
      export-images: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.validation != 'quick') }}
  business:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.validation != 'quick')
    needs: [backend, frontend]
    uses: ./.github/workflows/full-validation.yaml
    with: {group: business}
  compatibility:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.validation != 'quick')
    needs: [backend, frontend]
    uses: ./.github/workflows/full-validation.yaml
    with: {group: compatibility}
  delivery:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.validation != 'quick')
    needs: [backend, frontend]
    uses: ./.github/workflows/full-validation.yaml
    with: {group: delivery}
  check:
    if: always()
    needs: [backend, frontend, business, compatibility, delivery]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 按触发场景严格汇总结果
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_VALIDATION: ${{ inputs.validation || 'full' }}
        run: python3 deploy/ci/gate.py
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [check]
    permissions: {contents: write, packages: write}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 记录下载开始
        run: echo "CI_TRANSFER_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: images-*
          path: ${{ runner.temp }}/images
      - name: 记录下载耗时
        run: echo "- publish-download seconds=$(($(date +%s) - CI_TRANSFER_STARTED))" >> "$GITHUB_STEP_SUMMARY"
      - name: 只加载本次受测runtime
        run: |
          python3 deploy/ci/images.py load --part backend --directory "$RUNNER_TEMP/images/images-backend" --runtime-only
          python3 deploy/ci/images.py load --part frontend --directory "$RUNNER_TEMP/images/images-frontend" --runtime-only
      - name: 登录镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 发布本次已验收镜像与摘要清单
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          registry="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          sh deploy/publish.sh "$RELEASE_TAG" "$registry" "$RUNNER_TEMP/elect-release"
      - name: 保存固定摘要与目标机部署包
        uses: actions/upload-artifact@v4
        with:
          name: elect-${{ github.ref_name }}
          path: ${{ runner.temp }}/elect-release/
          if-no-files-found: error
      - name: 保存开发版发布资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/elect-release/notes.md" <<'EOF'
          本开发版发布本次容器验证通过的实际前后端镜像、固定摘要清单和只依赖Docker的部署包。首次启动/升级按基础服务、迁移、领域服务、后台与入口分阶段执行，不在目标机构建。

          2核2GB/50人24小时容量、真实支付D02映射和生产异机/PITR仍未验收。页面刷新与数据清理是第五步后续事项；默认学校写、SMTP和支付能力保持关闭。
          EOF
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/elect-release/release.env" "$RUNNER_TEMP/elect-release/release.json" "$RUNNER_TEMP/elect-release/deploy-$RELEASE_TAG.tar.gz" --verify-tag --prerelease --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/elect-release/notes.md"
