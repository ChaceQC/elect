name: 容器验证
on:
  push:
  pull_request:
    branches: [main]
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    permissions: {contents: write, packages: write}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 单元契约构建与浏览器
        run: sh deploy/check.sh
      - name: 空库与可靠事件容器集成
        run: sh deploy/test-stack.sh "$RUNNER_TEMP/elect-t1" elect-test-ci combined
      - name: 无源码发布包与已有卷分阶段启动
        run: sh deploy/test-image-delivery.sh "$RUNNER_TEMP/elect-t1" elect-test-ci
      - name: 七域轻量组合与退出恢复升级
        run: sh deploy/test-low-resource.sh "$RUNNER_TEMP/elect-t1" elect-test-ci
      - name: 共享连接池与基础服务资源参数
        run: sh deploy/test-resource-parameters.sh "$RUNNER_TEMP/elect-t1" elect-test-ci
      - name: 提交后唤醒与推送消费并发取消
        run: sh deploy/test-execution-efficiency.sh "$RUNNER_TEMP/elect-t1" elect-test-ci
      - name: 加密备份与隔离恢复
        run: sh deploy/test-t7-recovery.sh "$RUNNER_TEMP/elect-t1" elect-test-ci
      - name: 七容器核心调用与原卷双向切换
        run: sh deploy/test-core.sh "$RUNNER_TEMP/elect-t1" elect-test-ci
      - name: 模拟容量与生产前端容器联调
        run: |
          ELECT_TEST_IMAGE=elect-backend-smoke:ops docker compose --env-file "$RUNNER_TEMP/elect-t1/stack.env" -f deploy/compose.yaml -f deploy/compose.test.yaml -p elect-test-ci run -T --rm --no-deps smoke python -m scripts.t7_capacity --plans 100 --workers 8
          ELECT_TEST_IMAGE=elect-backend-smoke:ops sh deploy/test-t7-browser.sh "$RUNNER_TEMP/elect-t1" elect-test-ci
      - name: 登录镜像仓库
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 发布本次已验收镜像与摘要清单
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          registry="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          sh deploy/publish.sh "$RELEASE_TAG" "$registry" "$RUNNER_TEMP/elect-release"
      - name: 保存固定摘要与目标机部署包
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: elect-${{ github.ref_name }}
          path: ${{ runner.temp }}/elect-release/
          if-no-files-found: error
      - name: 保存开发版发布资产
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/elect-release/notes.md" <<'EOF'
          本开发版发布本次容器验证通过的实际前后端镜像、固定摘要清单和只依赖Docker的部署包。首次启动/升级按基础服务、迁移、领域服务、后台与入口分阶段执行，不在目标机构建。

          2核2GB/50人24小时容量、真实支付D02映射和生产异机/PITR仍未验收。页面刷新与数据清理是第五步后续事项；默认学校写、SMTP和支付能力保持关闭。
          EOF
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/elect-release/release.env" "$RUNNER_TEMP/elect-release/release.json" "$RUNNER_TEMP/elect-release/deploy-$RELEASE_TAG.tar.gz" --verify-tag --prerelease --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/elect-release/notes.md"
      - name: 清理本次测试容器
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/elect-t1/stack.env" ]; then
            sh deploy/compose.sh "$RUNNER_TEMP/elect-t1/stack.env" elect-test-ci --test --browser --restore --profile '*' down
          fi
          if [ -f "$RUNNER_TEMP/elect-t1/recovery/restore.env" ]; then
            sh deploy/compose.sh "$RUNNER_TEMP/elect-t1/recovery/restore.env" elect-restore-elect-test-ci --restore --profile '*' down
          fi
