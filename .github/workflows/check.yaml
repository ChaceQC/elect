name: 容器验证
on:
  push:
  pull_request:
    branches: [main]
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: 单元契约构建与浏览器
        run: sh deploy/check.sh
      - name: 空库与可靠事件容器集成
        run: sh deploy/test-stack.sh "$RUNNER_TEMP/elect-t1" elect-test-ci combined
      - name: 七域轻量组合与退出恢复升级
        run: sh deploy/test-low-resource.sh "$RUNNER_TEMP/elect-t1" elect-test-ci
      - name: 共享连接池与基础服务资源参数
        run: sh deploy/test-resource-parameters.sh "$RUNNER_TEMP/elect-t1" elect-test-ci
      - name: 加密备份与隔离恢复
        run: sh deploy/test-t7-recovery.sh "$RUNNER_TEMP/elect-t1" elect-test-ci
      - name: 模拟容量与生产前端容器联调
        run: |
          ELECT_TEST_IMAGE=elect-backend-smoke:ops docker compose --env-file "$RUNNER_TEMP/elect-t1/stack.env" -f deploy/compose.yaml -f deploy/compose.test.yaml -p elect-test-ci run -T --rm --no-deps smoke python -m scripts.t7_capacity --plans 100 --workers 8
          ELECT_TEST_IMAGE=elect-backend-smoke:ops sh deploy/test-t7-browser.sh "$RUNNER_TEMP/elect-t1" elect-test-ci
      - name: 清理本次测试容器
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/elect-t1/stack.env" ]; then
            sh deploy/compose.sh "$RUNNER_TEMP/elect-t1/stack.env" elect-test-ci --test --browser --restore --profile '*' down
          fi
          if [ -f "$RUNNER_TEMP/elect-t1/recovery/restore.env" ]; then
            sh deploy/compose.sh "$RUNNER_TEMP/elect-t1/recovery/restore.env" elect-restore-elect-test-ci --restore --profile '*' down
          fi
