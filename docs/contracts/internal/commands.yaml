schema_version: 1
prefix: /internal/v1
authentication:
  scheme: short_lived_service_jwt
  claims: [iss, sub, aud, exp, iat, jti]
  ttl_seconds: 60
  user_context: 单次请求的 user_id/session_version 经 Identity 校验，由 Gateway 签名；owner_user_id 必须匹配可信上下文。
  enforcement: 接收方验证服务身份、权限、对象归属；拒绝任意 X-User-Id，禁止跨库访问。
commands:
  - name: dispatch_binding_removal
    receiver: school_adapter
    callers: [room]
    method: POST
    path: /upstream/removals
    request: schemas.json#/$defs/DispatchRemoval
    response: schemas.json#/$defs/UpstreamResult
    idempotency: school:binding 权限；永久摘要不含易变lease_owner；发送前自行回查Room租约/槽位和默认屏障，dispatched后只回查。
  - name: query_removal_intent
    receiver: room
    callers: [school_adapter]
    method: POST
    path: /controls/removal
    request: schemas.json#/$defs/RemovalProofQuery
    response: schemas.json#/$defs/RemovalProof
    idempotency: room:remove-read 权限；本人操作/lease/撤除槽与脱敏目标事实，调用者不能自报租约有效。
  - name: query_retarget_barrier
    receiver: monitoring
    callers: [school_adapter]
    method: POST
    path: /monitor/retarget-barrier
    request: schemas.json#/$defs/OperationQuery
    response: 本人retarget操作的state/target_binding_id/expected_preference_version
    idempotency: monitor:retarget-read 权限；默认解绑发送前必须为prepared、空目标与原偏好版本。
  - name: read_room_filters
    receiver: school_adapter
    callers: [room]
    method: POST
    path: /rooms/filters
    request: schemas.json#/$defs/RoomFilterQuery
    response: 三级 FilterChoices items.id/label；不回显其他住户
    idempotency: 安全读取；搜索在前端当前列表内完成，学校 searchValue 固定为空。
  - name: verify_binding_candidate
    receiver: school_adapter
    callers: [room]
    method: POST
    path: /rooms/candidate
    request: schemas.json#/$defs/CandidateQuery
    response: schemas.json#/$defs/VerifiedCandidate
    idempotency: school:binding 权限；校验本人/TTL/精确 roomId，仅返回脱敏目标和凭据快照。
  - name: introspect_session
    receiver: identity
    callers: [gateway]
    method: POST
    path: /sessions/introspect
    request: schemas.json#/$defs/SessionIntrospection
    response: schemas.json#/$defs/SessionContext
    idempotency: 安全查询，每个写请求均实时验证，不缓存失效会话。
  - name: authenticate_login
    receiver: school_adapter
    callers: [identity]
    method: POST
    path: /login-attempts/authenticate
    request: schemas.json#/$defs/AuthenticateLogin
    response: schemas.json#/$defs/StagedCredential
    idempotency: attempt_id 唯一；challenge 只提交一次；明文只在内存/TLS 传输，失败不覆盖旧凭据。
  - name: activate_credential
    receiver: school_adapter
    callers: [identity]
    method: POST
    path: /credentials/activate
    request: schemas.json#/$defs/ActivateCredential
    response: schemas.json#/$defs/CredentialResult
    idempotency: attempt_id 唯一，重复激活返回原版本；Adapter 自行回查 Monitoring 屏障后才激活。
  - name: prepare_credential_update
    receiver: monitoring
    callers: [identity]
    method: POST
    path: /credentials/prepare-update
    request: schemas.json#/$defs/UpdateCredentialBarrier
    response: schemas.json#/$defs/RetargetBarrier
    idempotency: operation_id 为登录 attempt_id；首次版本为0，prepare 改代并阻断旧执行，重复确认不改代。
  - name: commit_credential_update
    receiver: monitoring
    callers: [identity]
    method: POST
    path: /credentials/commit-update
    request: schemas.json#/$defs/UpdateCredentialBarrier
    response: schemas.json#/$defs/RetargetBarrier
    idempotency: 回查 Adapter 当前激活版本/授权，按持久操作提交，保留最新关闭意图。
  - name: abort_credential_update
    receiver: monitoring
    callers: [identity]
    method: POST
    path: /credentials/abort-update
    request: schemas.json#/$defs/UpdateCredentialBarrier
    response: schemas.json#/$defs/RetargetBarrier
    idempotency: 仅 Adapter 确认仍为旧版本时补偿；使用新代次，不恢复旧执行。
  - name: query_credential_barrier
    receiver: monitoring
    callers: [school_adapter]
    method: POST
    path: /credentials/barrier
    request: schemas.json#/$defs/OperationQuery
    response: 本人持久操作的credential_ref/expected_credential_version/kind/state
    idempotency: Adapter 激活/撤销前自行读取并核对屏障，调用者不能自报屏障成功。
  - name: query_credential_control
    receiver: school_adapter
    callers: [identity, monitoring]
    method: POST
    path: /credentials/control-view
    request: 已签名用户上下文
    response: schemas.json#/$defs/CredentialProof
    idempotency: 本人当前持久版本/状态/授权，不返回密码或token。
  - name: prepare_retarget
    receiver: monitoring
    callers: [room]
    method: POST
    path: /monitor/prepare-retarget
    request: schemas.json#/$defs/PrepareRetarget
    response: schemas.json#/$defs/RetargetBarrier
    idempotency: operation_id 唯一；无 monitor 时建立 disabled 记录，binding_id 可空，不自动开启。
  - name: commit_retarget
    receiver: monitoring
    callers: [room]
    method: POST
    path: /monitor/commit-retarget
    request: schemas.json#/$defs/CommitRetarget
    response: schemas.json#/$defs/RetargetBarrier
    idempotency: operation_id 唯一；回查 Room 已提交偏好版本，遵守最新 desired_enabled。
  - name: compensate_retarget
    receiver: monitoring
    callers: [room]
    method: POST
    path: /monitor/compensate-retarget
    request: schemas.json#/$defs/PrepareRetarget
    response: schemas.json#/$defs/RetargetBarrier
    idempotency: operation_id 唯一；只在 Room 未提交时恢复旧目标，使用新代次，不能复活旧运行。
  - name: prepare_credential_revoke
    receiver: monitoring
    callers: [identity]
    method: POST
    path: /credentials/prepare-revoke
    request: schemas.json#/$defs/RevokeBarrier
    response: schemas.json#/$defs/RetargetBarrier
    idempotency: operation_id 唯一；先提交代次/取消/停止新发送许可，之后撤销密文/token。
  - name: commit_credential_revoke
    receiver: monitoring
    callers: [identity]
    method: POST
    path: /credentials/commit-revoke
    request: schemas.json#/$defs/RevokeBarrier
    response: schemas.json#/$defs/RetargetBarrier
    idempotency: 回查 Adapter 当前版本已 revoked，再确认撤回；重复确认不触及后来的授权。
  - name: query_preference_commit
    receiver: room
    callers: [monitoring]
    method: POST
    path: /controls/preference
    request: schemas.json#/$defs/OperationQuery
    response: schemas.json#/$defs/PreferenceProof
    idempotency: 按本人 switch_default 操作读取持久提交版本；未提交或未明确终止时不允许提交/补偿，调用方不能自报成功。
  - name: revoke_credential
    receiver: school_adapter
    callers: [identity]
    method: POST
    path: /credentials/revoke
    request: schemas.json#/$defs/RevokeCredential
    response: schemas.json#/$defs/CredentialResult
    idempotency: operation_id 唯一且 expected_credential_version 匹配；自行回查屏障后删除密码/历史暂存，旧token清理成功才确认，重放不触及新版本。
  - name: authorize_send
    receiver: monitoring
    callers: [notification]
    method: POST
    path: /alert-slots/authorize-send
    request: schemas.json#/$defs/AuthorizeSend
    response: schemas.json#/$defs/SendPermit
    idempotency: job_id/execution_epoch 唯一，许可30秒；当前代次/邮箱/序号、最后成功低余额样本（5分钟内）、冷却原子检查，过期不盲重授；失联禁止发信。
  - name: dispatch_binding
    receiver: school_adapter
    callers: [room]
    method: POST
    path: /upstream/bindings
    request: schemas.json#/$defs/DispatchBinding
    response: schemas.json#/$defs/UpstreamResult
    idempotency: school:binding 权限；upstream_operation_id 唯一、同用户/目标未解决屏障；prepared 先查 B02，dispatched 后只回查；10分钟 unknown 保留台账；binding_record 仅含脱敏确认事实。
  - name: dispatch_order
    receiver: school_adapter
    callers: [payment]
    method: POST
    path: /upstream/orders
    request: schemas.json#/$defs/DispatchOrder
    response: schemas.json#/$defs/UpstreamResult
    idempotency: upstream_operation_id 唯一；只一次 D01，无 D03 自动备用写入。
  - name: query_upstream_operation
    receiver: school_adapter
    callers: [room, payment]
    method: POST
    path: /upstream/operations/query
    request: schemas.json#/$defs/QueryOperation
    response: schemas.json#/$defs/UpstreamResult
    idempotency: 只查询已登记的本人操作，查不到不能自动重发。
  - name: payment_session_step
    receiver: school_adapter
    callers: [payment]
    method: POST
    path: /payment-sessions/step
    request: schemas.json#/$defs/PaymentSessionCommand
    response: schemas.json#/$defs/UpstreamResult
    idempotency: order_id/step 持久台账；E02/E03 dispatched 后未知不能盲重发；CookieJar 与 SDGL token 隔离。
  - name: query_public_operation
    receiver: [identity, room, payment]
    callers: [gateway]
    method: POST
    path: /operations/query
    request: schemas.json#/$defs/QueryOperation
    response: ../openapi.yaml#/components/schemas/Operation
    idempotency: Gateway 固定白名单查询三域，域内再次校验归属；不接收客户端 URL，run/order 使用专用查询。

# T2 运行路由使用固定代理目标，不接受浏览器内部 URL。
t2_routes:
  - {receiver: school_adapter, callers: [gateway], scope: 'captcha:create', path: /captchas, request: 'schemas.json#/$defs/ChallengeCommand', response: '../openapi.yaml#/components/schemas/Captcha'}
  - {receiver: school_adapter, callers: [identity], scope: 'credential:authenticate', path: /login-attempts/status, request: 'schemas.json#/$defs/AttemptQuery', response: 'schemas.json#/$defs/StagedCredential'}
  - {receiver: school_adapter, callers: [identity], scope: 'credential:read', path: /credentials/view, request: 已签名用户上下文, response: 本人账号与凭据版本状态，不含密码或token}
  - {receiver: school_adapter, callers: [room], scope: 'school:rooms', path: /rooms/bound, request: 已签名用户上下文, response: B02精简字段与十进制余额}
  - {receiver: school_adapter, callers: [room], scope: 'school:rooms', path: /rooms/candidates, request: 'schemas.json#/$defs/RoomQuery', response: '../openapi.yaml#/components/schemas/Candidates'}
  - {receiver: identity, callers: [gateway], scope: 'identity:browser', path: /browser/agreement, request: 无, response: '../openapi.yaml#/components/schemas/Agreement'}
  - {receiver: identity, callers: [gateway], scope: 'identity:browser', path: /browser/login, request: 'schemas.json#/$defs/BrowserLogin', response: TLS-only会话token与LoginResult，Gateway仅置安全Cookie}
  - {receiver: identity, callers: [gateway], scope: 'identity:browser', path: /browser/me, request: 'schemas.json#/$defs/BrowserSession', response: '../openapi.yaml#/components/schemas/Me'}
  - {receiver: identity, callers: [gateway], scope: 'identity:browser', path: /browser/logout, request: 'schemas.json#/$defs/BrowserSession', response: 当前会话吊销确认}
  - {receiver: room, callers: [gateway], scope: 'room:browser', path: /browser/bindings, request: 'schemas.json#/$defs/RoomQuery', response: '../openapi.yaml#/components/schemas/Bindings'}
  - {receiver: room, callers: [gateway], scope: 'room:browser', path: /browser/sync, request: idempotency_key（16..128）, response: '../openapi.yaml#/components/schemas/AcceptedOperation'}
  - {receiver: room, callers: [gateway], scope: 'room:browser', path: /browser/candidates, request: 'schemas.json#/$defs/RoomQuery', response: '../openapi.yaml#/components/schemas/Candidates'}
  - {receiver: room, callers: [gateway], scope: 'room:browser', path: /browser/operation, request: operation_id及已签名user_id, response: '../openapi.yaml#/components/schemas/Operation'}

# T3 控制/撤回已接通；默认发起入口与真实运行等待后续批次。
t3_control_routes:
  - {receiver: monitoring, callers: [gateway], scope: 'monitor:browser', path: /browser/monitor, request: 已签名用户上下文, response: '../openapi.yaml#/components/schemas/Monitor'}
  - {receiver: monitoring, callers: [gateway], scope: 'monitor:browser', path: /browser/monitor-config, request: '../openapi.yaml#/components/schemas/MonitorPatch', response: '../openapi.yaml#/components/schemas/Monitor'}
  - {receiver: monitoring, callers: [room], scope: 'monitor:retarget', path: /monitor/prepare-retarget, request: 'schemas.json#/$defs/PrepareRetarget', response: 'schemas.json#/$defs/RetargetBarrier'}
  - {receiver: monitoring, callers: [room], scope: 'monitor:retarget', path: /monitor/commit-retarget, request: 'schemas.json#/$defs/CommitRetarget', response: 'schemas.json#/$defs/RetargetBarrier'}
  - {receiver: monitoring, callers: [room], scope: 'monitor:retarget', path: /monitor/compensate-retarget, request: 'schemas.json#/$defs/PrepareRetarget', response: 'schemas.json#/$defs/RetargetBarrier'}
  - {receiver: monitoring, callers: [identity], scope: 'monitor:credential', path: /credentials/prepare-revoke, request: 'schemas.json#/$defs/RevokeBarrier', response: 'schemas.json#/$defs/RetargetBarrier'}
  - {receiver: room, callers: [monitoring], scope: 'room:control', path: /controls/preference, request: 'schemas.json#/$defs/OperationQuery', response: 'schemas.json#/$defs/PreferenceProof'}
  - {receiver: identity, callers: [gateway], scope: 'identity:browser', path: /browser/revoke, request: '../openapi.yaml#/components/schemas/VersionRequest', response: '../openapi.yaml#/components/schemas/AcceptedOperation'}
  - {receiver: identity, callers: [gateway], scope: 'identity:browser', path: /browser/operation, request: 'schemas.json#/$defs/OperationQuery', response: '../openapi.yaml#/components/schemas/Operation'}

t4_query_routes:
  - {receiver: room, callers: [gateway], scope: 'room:browser', path: /browser/balance, request: 'schemas.json#/$defs/BindingQuery', response: '../openapi.yaml#/components/schemas/Balance'}
  - {receiver: room, callers: [gateway], scope: 'room:browser', path: /browser/balance-refresh, request: binding_id与idempotency_key, response: '../openapi.yaml#/components/schemas/AcceptedOperation'}
  - {receiver: room, callers: [gateway], scope: 'room:browser', path: /browser/consumption, request: 'schemas.json#/$defs/ConsumptionQuery', response: '../openapi.yaml#/components/schemas/Consumption'}
  - {receiver: room, callers: [gateway], scope: 'room:browser', path: /browser/history-sync, request: binding_id/日期范围/idempotency_key, response: '../openapi.yaml#/components/schemas/AcceptedOperation'}
  - {receiver: room, callers: [school_adapter, monitoring], scope: 'room:query', path: /controls/query-target, request: 'schemas.json#/$defs/BindingQuery', response: 本人active绑定的school_room_id，仅内部使用}
  - {receiver: school_adapter, callers: [room], scope: 'school:history', path: /queries/history, request: 'schemas.json#/$defs/HistoryWindowQuery', response: 授权请求C02白名单行/指纹/请求归属}
  - {receiver: school_adapter, callers: [monitoring], scope: 'school:collect', path: /queries/collect, request: 'schemas.json#/$defs/BindingQuery', response: 逐school_room_id精确匹配的B02余额}

t4_run_routes:
  - {receiver: room, callers: [school_adapter], scope: 'room:balance-commit', path: /controls/balance-observed, request: 'schemas.json#/$defs/BalanceObservation', response: 对应本人有效Binding的缓存观察，旧时间不得覆盖新缓存}
  - {receiver: monitoring, callers: [gateway], scope: 'monitor:browser', path: /browser/runs, request: idempotency_key, response: '../openapi.yaml#/components/schemas/AcceptedRun'}
  - {receiver: monitoring, callers: [gateway], scope: 'monitor:browser', path: /browser/run, request: 'schemas.json#/$defs/RunQuery', response: '../openapi.yaml#/components/schemas/Run'}
  - {receiver: monitoring, callers: [gateway], scope: 'monitor:browser', path: /browser/cancel, request: 'schemas.json#/$defs/CancelRunQuery', response: '../openapi.yaml#/components/schemas/Run'}
  - {receiver: monitoring, callers: [gateway], scope: 'monitor:browser', path: /browser/samples, request: 'schemas.json#/$defs/SampleQuery', response: '../openapi.yaml#/components/schemas/Samples'}
  - {receiver: monitoring, callers: 内部服务, scope: 'foundation:read', path: /monitor/metrics, method: GET, request: 无, response: 调度/积压/租约/尝试计数，无用户标识}

t5_delivery_routes:
  - {receiver: monitoring, callers: [notification], scope: 'monitor:alert-read', path: /alert-slots/snapshot, request: 'schemas.json#/$defs/AlertSlotQuery', response: 'schemas.json#/$defs/AlertSnapshot'}
  - {receiver: monitoring, callers: [notification], scope: 'monitor:authorize-send', path: /alert-slots/authorize-send, request: 'schemas.json#/$defs/AuthorizeSend', response: 'schemas.json#/$defs/SendPermit'}
