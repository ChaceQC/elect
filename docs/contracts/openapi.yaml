components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-elect_session
      description: HTTPS：Secure; HttpOnly; SameSite=Lax; Path=/；不设置 Domain。显式私网 HTTP
        部署使用 elect_session_local（HttpOnly/SameSite=Lax/Path=/），Cookie 模式只由服务端可信 Origin
        决定。
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 按用户+操作类型分区，原请求摘要一致才能重放，至少保留 180 天
      schema:
        type: string
        minLength: 16
        maxLength: 128
  schemas:
    DTO:
      additionalProperties: false
      properties: {}
      title: DTO
      type: object
    Meta:
      additionalProperties: false
      properties:
        request_id:
          format: uuid
          title: Request Id
          type: string
        server_time:
          format: date-time
          title: Server Time
          type: string
      required:
      - request_id
      - server_time
      title: Meta
      type: object
    ErrorCode:
      enum:
      - INVALID_ARGUMENT
      - INVALID_INTERVAL
      - INVALID_DATE_RANGE
      - CAPTCHA_INVALID
      - CAPTCHA_EXPIRED
      - APP_SESSION_EXPIRED
      - SCHOOL_LOGIN_REJECTED
      - CSRF_REJECTED
      - ORIGIN_REJECTED
      - NOT_FOUND
      - VERSION_CONFLICT
      - IDEMPOTENCY_CONFLICT
      - OPERATION_IN_PROGRESS
      - SCHOOL_REAUTH_REQUIRED
      - REAUTH_ACCOUNT_MISMATCH
      - ROOM_CANDIDATE_EXPIRED
      - SCHOOL_BINDING_REJECTED
      - SNAPSHOT_EXPIRED
      - SNAPSHOT_MISMATCH
      - PRECONDITION_REQUIRED
      - RATE_LIMITED
      - SCHOOL_PROTOCOL_CHANGED
      - SCHOOL_INVALID_RESPONSE
      - SCHOOL_UNAVAILABLE
      - CIRCUIT_OPEN
      - DEPENDENCY_UNAVAILABLE
      - SCHOOL_TIMEOUT
      - PAYMENT_UNAVAILABLE
      - FEATURE_DISABLED
      title: ErrorCode
      type: string
    Error:
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          title: Message
          type: string
        retryable:
          title: Retryable
          type: boolean
        retry_after_seconds:
          anyOf:
          - minimum: 0
