# 文件路径为容器内路径；内容通过受限宿主机目录的 Docker Secret 注入。
schema_version: 1
domains:
  identity:
    database: elect_identity
    runtime_account: elect_identity_app
    ddl_account: elect_identity_ddl
  school_adapter:
    database: elect_school
    runtime_account: elect_school_app
    ddl_account: elect_school_ddl
  room:
    database: elect_room
    runtime_account: elect_room_app
    ddl_account: elect_room_ddl
  monitoring:
    database: elect_monitoring
    runtime_account: elect_monitoring_app
    ddl_account: elect_monitoring_ddl
  notification:
    database: elect_notification
    runtime_account: elect_notification_app
    ddl_account: elect_notification_ddl
  payment:
    database: elect_payment
    runtime_account: elect_payment_app
    ddl_account: elect_payment_ddl
  audit:
    database: elect_audit
    runtime_account: elect_audit_app
    ddl_account: elect_audit_ddl
grants:
  runtime: [SELECT, INSERT, UPDATE, DELETE]
  ddl: [CREATE, ALTER, DROP, INDEX, REFERENCES, SELECT, INSERT, UPDATE, DELETE]
  scope: 仅本领域 database.*；Gateway 无业务库账号；生产应用不挂载 root/DDL Secret。
injection:
  runtime_url_pattern: ELECT_{DOMAIN}_DB_URL_FILE
  ddl_url_pattern: ELECT_{DOMAIN}_DDL_URL_FILE
  url_scheme: mysql+asyncmy
  credentials: /run/secrets/{domain}_db_url
  service_signing: /run/secrets/{service}_jwt_private_key
  service_trust_bundle: /run/secrets/service_jwt_trust_bundle
  school_kek: /run/secrets/school_kek_bundle
  school_lookup_hmac: /run/secrets/school_lookup_hmac_bundle
  identity_session_pepper: /run/secrets/identity_session_pepper
  monitoring_encryption: /run/secrets/monitoring_encryption_key_bundle
  notification_encryption: /run/secrets/notification_encryption_key_bundle
  payment_encryption: /run/secrets/payment_encryption_key_bundle
  smtp_credentials: /run/secrets/smtp_credentials
  redis_credentials: /run/secrets/redis_credentials
  rabbitmq_credentials: /run/secrets/rabbitmq_credentials
permissions:
  school_kek_bundle: [school_adapter]
  school_lookup_hmac_bundle: [school_adapter]
  identity_session_pepper: [identity]
  monitoring_encryption_key_bundle: [monitoring]
  notification_encryption_key_bundle: [notification]
  payment_encryption_key_bundle: [payment]
  smtp_credentials: [notification]
  service_private_key: 仅对应服务
  trust_bundle: 所有接收服务；仅包含公开验证密钥和允许的 iss/aud/scope。
