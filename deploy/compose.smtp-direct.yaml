# 本机 TUN 环境专用；仅 SMTP 定向出口，监听 Docker 网桥而非外部网卡。
services:
  smtp-direct:
    image: ${ELECT_IMAGE:?set-backend-image}
    init: true
    restart: unless-stopped
    user: "0:0"
    network_mode: host
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    environment:
      ELECT_SMTP_DIRECT_CONFIG_FILE: /run/secrets/smtp_direct_proxy
    secrets: [smtp_direct_proxy]
    command: [python, -m, services.deployment.smtp_direct_proxy]
    healthcheck:
      test: [CMD, python, -c, 'import json,os,socket; c=json.load(open(os.environ["ELECT_SMTP_DIRECT_CONFIG_FILE"])); socket.create_connection((c["listen_host"],c["listen_port"]),2).close()']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  notification-worker:
    depends_on:
      smtp-direct: {condition: service_healthy}
secrets:
  smtp_direct_proxy: {file: "${ELECT_SECRETS_DIR}/smtp_direct_proxy"}
