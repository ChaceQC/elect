name: elect

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-python: &python
  image: ${ELECT_IMAGE:?set-backend-image}
  build: {context: ../backend, dockerfile: Dockerfile}
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=16m,mode=1777"]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [app, data]
  environment: &runtime-env
    ELECT_RUNTIME_FILE: /run/secrets/runtime
    ELECT_BACKGROUND_ENABLED: ${ELECT_BACKGROUND_ENABLED:-true}
    ELECT_PUBLIC_ORIGIN: ${ELECT_PUBLIC_ORIGIN:-https://${ELECT_DOMAIN:-}}
    ELECT_ALLOW_LOCAL_HTTP: ${ELECT_ALLOW_LOCAL_HTTP:-false}
    ELECT_HTTP_BIND: ${ELECT_HTTP_BIND:-}
    ELECT_HTTP_PORT: ${ELECT_HTTP_PORT:-}
    ELECT_ALLOW_SCHOOL_BINDING_WRITES: ${ELECT_ALLOW_SCHOOL_BINDING_WRITES:-false}
    ELECT_ALLOW_PAYMENT_ORDER_WRITES: ${ELECT_ALLOW_PAYMENT_ORDER_WRITES:-false}
    ELECT_ALLOW_PAYMENT_FORM_WRITES: ${ELECT_ALLOW_PAYMENT_FORM_WRITES:-false}
    ELECT_ALLOW_REAL_SMTP: ${ELECT_ALLOW_REAL_SMTP:-false}
    ELECT_PAYMENT_ACCEPTANCE_PASSED: ${ELECT_PAYMENT_ACCEPTANCE_PASSED:-false}
  depends_on:
    mysql: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}
  healthcheck: &api-health
    test: [CMD, python, -m, services.common.healthcheck]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 15s
  mem_limit: 160m
  cpus: 0.5
  pids_limit: 128
  stop_grace_period: 30s
  logging: *logging

x-job: &job
  <<: *python
  networks: [data]
  healthcheck:
    <<: *api-health
    test: [CMD, python, -m, services.common.healthcheck, worker]
  depends_on:
    mysql: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}
    rabbitmq: {condition: service_healthy}

services:
  nginx:
    image: ${ELECT_WEB_IMAGE:?set-frontend-image}
    build: {context: ../frontend, dockerfile: Dockerfile}
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    networks: [edge, app]
    read_only: true
    tmpfs: [/etc/nginx/conf.d, /var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    environment:
      ELECT_DOMAIN: ${ELECT_DOMAIN:-}
      NGINX_ENVSUBST_FILTER: "^ELECT_DOMAIN$$"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    secrets: [tls_cert, tls_key]
    depends_on:
      gateway: {condition: service_healthy}
      tls-check: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, wget, -q, --spider, --no-check-certificate, "https://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 128
    logging: *logging

  tls-check:
    image: ${ELECT_IMAGE:?set-backend-image}
    build: {context: ../backend, dockerfile: Dockerfile}
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    logging: *logging
    user: "0:0"
    environment: {ELECT_DOMAIN: "${ELECT_DOMAIN:-}"}
    secrets: [tls_cert, tls_key]
    command: [python, -m, services.deployment.check_tls]

  mysql:
    image: ${MYSQL_IMAGE:?set-mysql-8.4-image}
    restart: unless-stopped
    networks: [data]
    environment: {MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password, TZ: UTC}
    secrets: [mysql_root_password, mysql_probe, mysql_bootstrap]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "mysql --defaults-extra-file=/run/secrets/mysql_probe -Nse 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256
    stop_grace_period: 90s
    logging: *logging

  redis:
    image: ${REDIS_IMAGE:?set-redis-image}
    restart: unless-stopped
    networks: [data]
    command: [redis-server, /etc/redis/redis.conf]
    volumes:
      - redis_data:/data
      - ./redis.conf:/etc/redis/redis.conf:ro
      - ./redis-healthcheck.sh:/usr/local/bin/elect-redis-healthcheck:ro
    secrets: [redis_acl, redis_probe]
    healthcheck:
      test: [CMD, sh, /usr/local/bin/elect-redis-healthcheck]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging: *logging

  rabbitmq:
    image: ${RABBITMQ_IMAGE:?set-rabbitmq-image}
    hostname: rabbitmq
    restart: unless-stopped
    networks: [data]
    environment: {RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +A 4"}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    secrets:
      - {source: rabbitmq_conf, target: /etc/rabbitmq/rabbitmq.conf}
      - rabbitmq_definitions
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
    mem_limit: 768m
    cpus: 1
    pids_limit: 256
    logging: *logging

  migrate:
    <<: *python
    restart: "no"
    networks: [data]
    environment: {ELECT_RUNTIME_FILE: /run/secrets/runtime}
    secrets: [{source: migration_runtime, target: runtime}]
    command: [python, -m, services.migrate_all_mysql]
    depends_on: {mysql: {condition: service_healthy}}
    healthcheck: {disable: true}
    mem_limit: 256m

  gateway:
    <<: *python
    networks: [app]
    environment:
      <<: *runtime-env
      ELECT_INTERNAL_CA_FILE: /run/secrets/internal_ca
    secrets: [{source: gateway_runtime, target: runtime}, internal_ca]
    command: [python, -m, services.gateway]
  identity:
    <<: *python
    environment:
      <<: *runtime-env
      ELECT_INTERNAL_CA_FILE: /run/secrets/internal_ca
      ELECT_INTERNAL_TLS_CERT_FILE: /run/secrets/identity_tls_cert
      ELECT_INTERNAL_TLS_KEY_FILE: /run/secrets/identity_tls_key
      ELECT_SESSION_PEPPER_FILE: /run/secrets/identity_session_pepper
    secrets: [{source: identity_runtime, target: runtime}, internal_ca, identity_tls_cert, identity_tls_key, identity_session_pepper]
    command: [python, -m, services.identity]
  school-adapter:
    <<: *python
    networks: [app, data, school_egress]
    mem_limit: 1024m
    cpus: 1
    environment:
      <<: *runtime-env
      ELECT_INTERNAL_CA_FILE: /run/secrets/internal_ca
      ELECT_INTERNAL_TLS_CERT_FILE: /run/secrets/school_tls_cert
      ELECT_INTERNAL_TLS_KEY_FILE: /run/secrets/school_tls_key
      ELECT_SCHOOL_KEK_FILE: /run/secrets/school_kek_bundle
      ELECT_SCHOOL_LOOKUP_FILE: /run/secrets/school_lookup_hmac_bundle
    secrets: [{source: school_adapter_runtime, target: runtime}, internal_ca, school_tls_cert, school_tls_key, school_kek_bundle, school_lookup_hmac_bundle]
    command: [python, -m, services.school_adapter]
  room:
    <<: *python
    environment:
      <<: *runtime-env
      ELECT_INTERNAL_CA_FILE: /run/secrets/internal_ca
    secrets: [{source: room_runtime, target: runtime}, internal_ca]
    command: [python, -m, services.room]
  monitoring:
    <<: *python
    environment:
      <<: *runtime-env
      ELECT_INTERNAL_CA_FILE: /run/secrets/internal_ca
      ELECT_EMAIL_KEY_FILE: /run/secrets/monitoring_encryption_key_bundle
    secrets: [{source: monitoring_runtime, target: runtime}, internal_ca, monitoring_encryption_key_bundle]
    command: [python, -m, services.monitoring]
  notification:
    <<: *python
    environment:
      <<: *runtime-env
      ELECT_INTERNAL_CA_FILE: /run/secrets/internal_ca
      ELECT_EMAIL_KEY_FILE: /run/secrets/notification_encryption_key_bundle
      ELECT_SMTP_CONFIG_FILE: /run/secrets/smtp_credentials
    secrets: [{source: notification_runtime, target: runtime}, internal_ca, notification_encryption_key_bundle, smtp_credentials]
    command: [python, -m, services.notification]
  notification-worker:
    <<: *python
    networks: [app, data, notification_egress]
    environment:
      <<: *runtime-env
      ELECT_INTERNAL_CA_FILE: /run/secrets/internal_ca
      ELECT_EMAIL_KEY_FILE: /run/secrets/notification_encryption_key_bundle
      ELECT_SMTP_CONFIG_FILE: /run/secrets/smtp_credentials
    secrets: [{source: notification_runtime, target: runtime}, internal_ca, notification_encryption_key_bundle, smtp_credentials]
    command: [python, -m, services.notification.job, --role, worker]
    stop_grace_period: 45s
    healthcheck:
      <<: *api-health
      test: [CMD, python, -m, services.common.healthcheck, worker]
  notification-recovery:
    <<: *python
    environment:
      <<: *runtime-env
      ELECT_INTERNAL_CA_FILE: /run/secrets/internal_ca
      ELECT_EMAIL_KEY_FILE: /run/secrets/notification_encryption_key_bundle
      ELECT_SMTP_CONFIG_FILE: /run/secrets/smtp_credentials
    secrets: [{source: notification_runtime, target: runtime}, internal_ca, notification_encryption_key_bundle, smtp_credentials]
    command: [python, -m, services.notification.job, --role, recovery]
    healthcheck:
      <<: *api-health
      test: [CMD, python, -m, services.common.healthcheck, worker]
  monitor-alerts:
    <<: *python
    environment:
      <<: *runtime-env
      ELECT_INTERNAL_CA_FILE: /run/secrets/internal_ca
      ELECT_EMAIL_KEY_FILE: /run/secrets/monitoring_encryption_key_bundle
    secrets: [{source: monitoring_runtime, target: runtime}, internal_ca, monitoring_encryption_key_bundle]
    command: [python, -m, services.monitoring.job, --role, alerts]
    healthcheck:
      <<: *api-health
      test: [CMD, python, -m, services.common.healthcheck, worker]
  monitor-scheduler:
    <<: *python
    environment:
      <<: *runtime-env
      ELECT_INTERNAL_CA_FILE: /run/secrets/internal_ca
      ELECT_EMAIL_KEY_FILE: /run/secrets/monitoring_encryption_key_bundle
    secrets: [{source: monitoring_runtime, target: runtime}, internal_ca, monitoring_encryption_key_bundle]
    command: [python, -m, services.monitoring.job, --role, scheduler]
    healthcheck:
      <<: *api-health
      test: [CMD, python, -m, services.common.healthcheck, worker]
  monitor-worker:
    <<: *python
    environment:
      <<: *runtime-env
      ELECT_INTERNAL_CA_FILE: /run/secrets/internal_ca
      ELECT_EMAIL_KEY_FILE: /run/secrets/monitoring_encryption_key_bundle
    secrets: [{source: monitoring_runtime, target: runtime}, internal_ca, monitoring_encryption_key_bundle]
    command: [python, -m, services.monitoring.job, --role, worker]
    stop_grace_period: 100s
    healthcheck:
      <<: *api-health
      test: [CMD, python, -m, services.common.healthcheck, worker]
  monitor-recovery:
    <<: *python
    environment:
      <<: *runtime-env
      ELECT_INTERNAL_CA_FILE: /run/secrets/internal_ca
      ELECT_EMAIL_KEY_FILE: /run/secrets/monitoring_encryption_key_bundle
    secrets: [{source: monitoring_runtime, target: runtime}, internal_ca, monitoring_encryption_key_bundle]
    command: [python, -m, services.monitoring.job, --role, recovery]
    healthcheck:
      <<: *api-health
      test: [CMD, python, -m, services.common.healthcheck, worker]
  payment:
    <<: *python
    environment:
      <<: *runtime-env
      ELECT_INTERNAL_CA_FILE: /run/secrets/internal_ca
    secrets: [{source: payment_runtime, target: runtime}, internal_ca]
    command: [python, -m, services.payment]
  payment-worker:
    <<: *job
    networks: [app, data]
    environment:
      <<: *runtime-env
      ELECT_INTERNAL_CA_FILE: /run/secrets/internal_ca
    secrets: [{source: payment_runtime, target: runtime}, internal_ca]
    command: [python, -m, services.payment.process, --role, worker]
    stop_grace_period: 180s
  payment-recovery:
    <<: *job
    environment:
      <<: *runtime-env
      ELECT_INTERNAL_CA_FILE: /run/secrets/internal_ca
    secrets: [{source: payment_runtime, target: runtime}, internal_ca]
    command: [python, -m, services.payment.process, --role, recovery]
  audit:
    <<: *python
    secrets: [{source: audit_runtime, target: runtime}]
    command: [python, -m, services.audit]

  identity-relay:
    <<: *job
    secrets: [{source: identity_runtime, target: runtime}]
    command: [python, -m, services.common.job, --service, identity, --role, relay]
  school-relay:
    <<: *job
    secrets: [{source: school_adapter_runtime, target: runtime}]
    command: [python, -m, services.common.job, --service, school_adapter, --role, relay]
  room-relay:
    <<: *job
    secrets: [{source: room_runtime, target: runtime}]
    command: [python, -m, services.common.job, --service, room, --role, relay]
  monitoring-relay:
    <<: *job
    secrets: [{source: monitoring_runtime, target: runtime}]
    command: [python, -m, services.common.job, --service, monitoring, --role, relay]
  notification-relay:
    <<: *job
    secrets: [{source: notification_runtime, target: runtime}]
    command: [python, -m, services.common.job, --service, notification, --role, relay]
  payment-relay:
    <<: *job
    secrets: [{source: payment_runtime, target: runtime}]
    command: [python, -m, services.common.job, --service, payment, --role, relay]
  audit-worker:
    <<: *job
    secrets: [{source: audit_runtime, target: runtime}]
    command: [python, -m, services.common.job, --service, audit, --role, audit]

  identity-recovery:
    <<: *python
    environment:
      <<: *runtime-env
      ELECT_INTERNAL_CA_FILE: /run/secrets/internal_ca
      ELECT_SESSION_PEPPER_FILE: /run/secrets/identity_session_pepper
    secrets: [{source: identity_runtime, target: runtime}, internal_ca, identity_session_pepper]
    command: [python, -m, services.common.business_worker, --service, identity]
    healthcheck:
      <<: *api-health
      test: [CMD, python, -m, services.common.healthcheck, worker]
  room-sync-worker:
    <<: *python
    environment:
      <<: *runtime-env
      ELECT_INTERNAL_CA_FILE: /run/secrets/internal_ca
    secrets: [{source: room_runtime, target: runtime}, internal_ca]
    command: [python, -m, services.common.business_worker, --service, room]
    healthcheck:
      <<: *api-health
      test: [CMD, python, -m, services.common.healthcheck, worker]
  school-maintenance:
    <<: *python
    secrets: [{source: school_adapter_runtime, target: runtime}]
    command: [python, -m, services.common.business_worker, --service, school_adapter]
    healthcheck:
      <<: *api-health
      test: [CMD, python, -m, services.common.healthcheck, worker]

networks:
  edge: {}
  app: {internal: true}
  data: {internal: true}
  school_egress: {}
  notification_egress: {}
volumes:
  mysql_data: {}
  redis_data: {}
  rabbitmq_data: {}
secrets:
  mysql_root_password: {file: "${ELECT_SECRETS_DIR:?set-secret-directory}/mysql_root_password"}
  mysql_probe: {file: "${ELECT_SECRETS_DIR}/mysql_probe.cnf"}
  mysql_bootstrap: {file: "${ELECT_SECRETS_DIR}/mysql_bootstrap.sql"}
  migration_runtime: {file: "${ELECT_SECRETS_DIR}/migration_runtime.json"}
  gateway_runtime: {file: "${ELECT_SECRETS_DIR}/gateway_runtime.json"}
  identity_runtime: {file: "${ELECT_SECRETS_DIR}/identity_runtime.json"}
  school_adapter_runtime: {file: "${ELECT_SECRETS_DIR}/school_adapter_runtime.json"}
  room_runtime: {file: "${ELECT_SECRETS_DIR}/room_runtime.json"}
  monitoring_runtime: {file: "${ELECT_SECRETS_DIR}/monitoring_runtime.json"}
  monitoring_encryption_key_bundle: {file: "${ELECT_SECRETS_DIR}/monitoring_encryption_key_bundle"}
  notification_runtime: {file: "${ELECT_SECRETS_DIR}/notification_runtime.json"}
  notification_encryption_key_bundle: {file: "${ELECT_SECRETS_DIR}/notification_encryption_key_bundle"}
  smtp_credentials: {file: "${ELECT_SECRETS_DIR}/smtp_credentials"}
  payment_runtime: {file: "${ELECT_SECRETS_DIR}/payment_runtime.json"}
  audit_runtime: {file: "${ELECT_SECRETS_DIR}/audit_runtime.json"}
  redis_acl: {file: "${ELECT_SECRETS_DIR}/redis_users.acl"}
  redis_probe: {file: "${ELECT_SECRETS_DIR}/redis_probe"}
  rabbitmq_conf: {file: "${ELECT_SECRETS_DIR}/rabbitmq.conf"}
  rabbitmq_definitions: {file: "${ELECT_SECRETS_DIR}/rabbitmq_definitions.json"}
  tls_cert: {file: "${ELECT_TLS_CERT_FILE:-/dev/null}"}
  tls_key: {file: "${ELECT_TLS_KEY_FILE:-/dev/null}"}
  internal_ca: {file: "${ELECT_SECRETS_DIR}/internal_ca.pem"}
  identity_tls_cert: {file: "${ELECT_SECRETS_DIR}/identity_tls_cert.pem"}
  identity_tls_key: {file: "${ELECT_SECRETS_DIR}/identity_tls_key.pem"}
  school_tls_cert: {file: "${ELECT_SECRETS_DIR}/school-adapter_tls_cert.pem"}
  school_tls_key: {file: "${ELECT_SECRETS_DIR}/school-adapter_tls_key.pem"}
  school_kek_bundle: {file: "${ELECT_SECRETS_DIR}/school_kek_bundle"}
  school_lookup_hmac_bundle: {file: "${ELECT_SECRETS_DIR}/school_lookup_hmac_bundle"}
  identity_session_pepper: {file: "${ELECT_SECRETS_DIR}/identity_session_pepper"}
